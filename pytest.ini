# ============================================================
# pytest 配置（步骤 6）
#
# pythonpath = .   告诉 pytest 把"项目根目录"加入模块搜索路径，
#                  这样测试文件里才能写 `from src.xxx import ...`
# testpaths = tests  限定测试只从 tests/ 目录里找，跑得更快
# ============================================================
[pytest]
pythonpath = .
testpaths = tests
